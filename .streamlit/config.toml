[server]
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true
enableStaticServing = false
[browser]
gatherUsageStats = false
[client]
toolbarMode = "minimal"
[theme]
base = "light"
primaryColor = "#17635B"
backgroundColor = "#F6F5F1"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#203935"
borderColor = "#D8DFDA"
dataframeHeaderBackgroundColor = "#EAF0EC"
font = "sans-serif"
baseFontSize = 16
baseRadius = "0.8rem"
buttonRadius = "0.5rem"
headingFontSizes = ["30px", "24px", "21px", "18px", "16px", "14px"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
metricValueFontSize = "2rem"
paddingTop = "2rem"
paddingBottom = "2rem"
showSidebarBorder = true
showWidgetBorder = true
orangeTextColor = "#8B4B12"
orangeBackgroundColor = "#FFF0DE"
[theme.sidebar]
backgroundColor = "#EAF0EC"
secondaryBackgroundColor = "#FFFFFF"
paddingTop = "2rem"
